    <style>
        @font-face {
            font-family: "Jua-Regular";
            src: url("assets/Jua-Regular.ttf") format("truetype");
            font-display: swap;
        }
        :root {
            color-scheme: light;
            --aqua: #ccf7f4;
            --ink: #000000;
            --muted: rgba(0, 63, 66, 0.78);
            --white: #ffffff;
            --peach: #ffb15e;
            --soft-pink: #ffb8d6;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Jua-Regular", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--aqua);
            color: var(--ink);
        }
        a {
            color: inherit;
        }
        main {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
            padding: clamp(28px, 5vw, 48px) 0 52px;
            text-align: center;
        }
        .hero-logo {
            width: min(260px, 68vw);
            height: auto;
            display: block;
            margin: 0 auto 12px;
        }
        .hero-title {
            margin: 0 0 12px;
            font-size: clamp(3rem, 10vw, 5.6rem);
            line-height: 0.98;
            letter-spacing: 0;
        }
        .hero-copy {
            max-width: 680px;
            margin: 0 auto 26px;
            color: var(--muted);
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            line-height: 1.45;
        }
        .cta-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 0 28px;
            border: 3px solid var(--ink);
            border-radius: 22px;
            background: var(--peach);
            color: var(--ink);
            font-size: 1.08rem;
            text-decoration: none;
            box-shadow: 0 6px 0 var(--ink);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--ink);
        }
        .button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--ink);
        }
        .parents-cta {
            margin-bottom: clamp(26px, 5vw, 42px);
        }
        .button-secondary {
            background: var(--white);
        }
        .button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 4px;
        }
        .mockup {
            margin: 0 auto;
            width: min(820px, 100%);
        }
        .mockup img {
            width: 100%;
            height: auto;
            display: block;
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.14);
        }
        .quick-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            color: var(--muted);
            font-size: 0.98rem;
        }
        .quick-info a {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        footer {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 34px;
            border-top: 3px solid var(--ink);
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.95rem;
        }
        footer a {
            color: var(--ink);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 700px) {
            .button {
                width: 100%;
            }
            .mockup img {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="hero-logo" src="assets/valid_logo.png" alt="Valid logo">
        <section class="hero" aria-labelledby="hero-title">
            <h1 class="hero-title" id="hero-title">Connect with classmates</h1>
            <p class="hero-copy">
                Be kind. Don't bully. Everything is moderated.
            </p>
            <div class="cta-row">

                <a class="button" href="app/?install=1&amp;signup=1">Download on Android</a>
            </div>
            <div class="parents-cta">
                <a class="button button-secondary" href="parents.html">FAQ for Parents</a>
            </div>
        </section>

        <section class="mockup" aria-label="Valid app preview">
            <img src="assets/phone_mockup.png" alt="Valid app phone mockup">
        </section>
