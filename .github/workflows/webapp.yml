name: Valid Web App

on:
  pull_request:
  push:
    branches:
      - main
      - validapp-webapp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valid-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:static-origin

  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android
            browser: chromium
          - project: desktop
            browser: chromium
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run each spec in a fresh browser process without retries
        run: |
          for spec in tests/*.spec.js; do
            if [[ "$spec" == "tests/deployed-origin.spec.js" ]]; then
              continue
            fi
            npm run test:e2e -- --project=${{ matrix.project }} "$spec" --retries=0
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-failure-artifacts
          path: test-results/
          if-no-files-found: ignore

  passkey-integration:
    if: vars.SIX7_INTEGRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check out the matching private Six7 backend branch
        uses: actions/checkout@v5
        with:
          repository: christophertran/six7
          ref: validapp-webapp-backend-changes
          path: _six7
          ssh-key: ${{ secrets.SIX7_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: _six7/requirements.txt
      - run: npm ci
      - run: pip install -r _six7/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Run a real related-origin WebAuthn ceremony
        env:
          SIX7_REPO: ${{ github.workspace }}/_six7
          SIX7_PYTHON: python
        run: npm run test:passkey-integration
