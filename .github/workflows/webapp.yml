name: Valid Web App

on:
  pull_request:
  push:
    branches:
      - main
      - validapp-webapp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valid-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
